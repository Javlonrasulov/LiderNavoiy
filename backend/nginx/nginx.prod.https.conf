# HTTPS-ready nginx (Let's Encrypt).
# 1) certbot certonly --webroot -w /var/www/certbot -d lider-navoiy.uz -d www.lider-navoiy.uz
# 2) docker-compose: mount this file as nginx.conf instead of nginx.prod.conf
# 3) Android/Web: api.base.url=https://lider-navoiy.uz/api/v1/

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 12M;

    upstream api {
        server api:3000;
    }

    server {
        listen 80 default_server;
        server_name lider-navoiy.uz www.lider-navoiy.uz 89.39.95.41 _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # IP orqali HTTP saqlanadi; domen HTTPS ga
        location / {
            if ($host ~* ^(lider-navoiy\.uz|www\.lider-navoiy\.uz)$) {
                return 301 https://$host$request_uri;
            }
            return 404;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /uploads/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /push/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /socket.io/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        location /health {
            proxy_pass http://api/api/v1/health;
        }

        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location /assets/ {
            root /usr/share/nginx/html;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name lider-navoiy.uz www.lider-navoiy.uz;

        ssl_certificate     /etc/letsencrypt/live/lider-navoiy.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lider-navoiy.uz/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }

        location /uploads/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /push/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /socket.io/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        location /health {
            proxy_pass http://api/api/v1/health;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
