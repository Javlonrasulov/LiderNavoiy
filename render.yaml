# Lider Navoiy — Render Blueprint
# https://render.com/deploy?repo=https://github.com/Javlonrasulov/LiderNavoiy

services:
  - type: web
    name: lider-navoiy-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: nest/typescript build uchun (NODE_ENV=production bo'lsa ham)
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: API_PREFIX
        value: api/v1
      - key: TYPEORM_SYNC
        value: "true"
      - key: SEED_ON_BOOT
        value: "true"
      - key: CORS_ORIGINS
        value: https://lider-navoiy.netlify.app,http://localhost:5173,http://localhost:3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Firebase FCM — Render dashboard da qo'ying (sync: false = blueprint overwrite qilmaydi)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lider-navoiy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lider-navoiy-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: lider-navoiy-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: lider-navoiy-db
    plan: free
    databaseName: distributor_crm
    user: crm_user
    postgresMajorVersion: "16"
    ipAllowList: []
